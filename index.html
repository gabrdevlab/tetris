<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris — Pocket Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="console" aria-label="Console portátil de Tetris">
  <div class="console-top">
    <span class="power-led" id="powerLed" aria-hidden="true"></span>
    <span class="brand">TETRIS<span class="brand-sub">POCKET EDITION</span></span>
  </div>

  <div class="screen-bezel">
    <div class="screen">
      <div class="screen-grid" aria-hidden="true"></div>
      <div class="playfield">
        <div class="board" id="board" role="img" aria-label="Tabuleiro do jogo"></div>
        <aside class="hud">
          <div class="hud-block">
            <p class="hud-label">Próxima</p>
            <div class="next" id="next"></div>
          </div>
          <div class="hud-block">
            <p class="hud-label">Pontos</p>
            <p class="hud-value" id="score">0000</p>
          </div>
          <div class="hud-block">
            <p class="hud-label">Linhas</p>
            <p class="hud-value" id="lines">00</p>
          </div>
          <div class="hud-block">
            <p class="hud-label">Nível</p>
            <p class="hud-value" id="level">01</p>
          </div>
        </aside>
      </div>
      <div class="screen-overlay" id="overlay">
        <p class="overlay-title" id="overlayTitle">TETRIS</p>
        <p class="overlay-sub" id="overlaySub">Pressione START para jogar</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" role="group" aria-label="Direcionais">
      <button class="dpad-btn dpad-up" id="btnUp" aria-label="Queda instantânea">▲</button>
      <button class="dpad-btn dpad-left" id="btnLeft" aria-label="Mover para a esquerda">◀</button>
      <button class="dpad-btn dpad-right" id="btnRight" aria-label="Mover para a direita">▶</button>
      <button class="dpad-btn dpad-down" id="btnDown" aria-label="Queda suave">▼</button>
      <div class="dpad-center" aria-hidden="true"></div>
    </div>
    <div class="ab-buttons" role="group" aria-label="Ações">
      <button class="round-btn btn-b" id="btnB" aria-label="Girar sentido anti-horário">B</button>
      <button class="round-btn btn-a" id="btnA" aria-label="Girar sentido horário">A</button>
    </div>
  </div>

  <div class="meta-buttons">
    <button class="pill-btn" id="btnSelect">SELECT</button>
    <button class="pill-btn" id="btnStart">START</button>
  </div>

  <div class="speaker" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
